{% extends 'base.html' %}{% block content %}<div class="actions"><a class="button" href="{% url 'company_new' %}">＋新增公司</a></div><section class="card table-wrap"><table><tr><th>公司</th><th>代碼</th><th>狀態</th><th></th></tr>{% for row in rows %}<tr><td>{{ row.name }}</td><td>{{ row.code }}</td><td>{% if row.is_active %}啟用{% else %}停用{% endif %}</td><td><a href="{% url 'company_edit' row.pk %}">管理</a></td></tr>{% empty %}<tr><td>尚無公司，請先新增。</td></tr>{% endfor %}</table></section>{% endblock %}

{% extends 'base.html' %}{% block content %}<section class="card">{% for n in rows %}<article class="entry"><small>{{ n.created_at }}</small><p>{{ n.message }}</p>{% if n.ticket %}<a href="{% url 'ticket_detail' n.ticket.pk %}">查看案件（依目前權限）</a>{% endif %}{% if not n.read_at %}<form method="post" action="{% url 'notification_read' n.pk %}">{% csrf_token %}<button class="secondary">標記已讀</button></form>{% endif %}</article>{% empty %}<p>目前沒有通知。</p>{% endfor %}{% include 'pagination.html' %}</section>{% endblock %}

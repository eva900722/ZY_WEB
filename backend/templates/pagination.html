{% if rows.paginator.num_pages > 1 %}<nav class="actions">{% if rows.has_previous %}<a href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ rows.previous_page_number }}">上一頁</a>{% endif %}<span>{{ rows.number }} / {{ rows.paginator.num_pages }}</span>{% if rows.has_next %}<a href="?{% for k,v in request.GET.items %}{% if k != 'page' %}{{ k|urlencode }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ rows.next_page_number }}">下一頁</a>{% endif %}</nav>{% endif %}
